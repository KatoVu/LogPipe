site_name: logpipe
site_description: Streaming log parsing, template learning, LogBERT anomaly detection and cited root-cause analysis.
site_url: https://katovu.github.io/LogPipe/
repo_url: https://github.com/KatoVu/LogPipe
repo_name: KatoVu/LogPipe
edit_uri: edit/main/docs/
docs_dir: docs
copyright: logpipe is released under the MIT License. DeepParse/ is Apache-2.0. See THIRD_PARTY_NOTICES.md.
strict: true

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    # Dark first: it is the default; light stays one click away.
    - scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
    - scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Install: getting-started/install.md
      - Set up an LLM: getting-started/llm.md
      - Web chat as the LLM: getting-started/web-chat.md
      - Set up the server: getting-started/server.md
      - Run it: getting-started/run.md
      - Install the agent: getting-started/agent.md
      - Commands: getting-started/commands.md
  - Architecture:
      - architecture/index.md
      - Parsing and the registry: architecture/parsing.md
      - Online template learning: architecture/enrichment.md
      - Unresolved queue on Kafka: kafka.md
      - Anomaly detection (LogBERT): architecture/anomaly.md
      - Server and learning lifecycle: agent-platform.md
      - Ask and root-cause analysis: architecture/ask-rca.md
      - Component graph: architecture/graph.md
      - MCP for AI assistants: architecture/mcp.md
      - Storage: architecture/storage.md
  - Benchmarks:
      - benchmarks/index.md
      - Results: benchmarks/results.md
      - RCAEval: benchmarks/rcaeval.md
      - Throughput: benchmark.md
  - Guides:
      - Code structure: guides/code-structure.md
      - Replacing components: guides/replace-components.md
      - Configuration: guides/configuration.md
      - Datadog: guides/datadog.md
      - MongoDB: guides/mongodb.md
      - Deploying tenants: guides/deploy.md
      - Maintenance: guides/maintenance.md
      - CI / CD: ci.md
